<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>База данных имен</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(59, 130, 246, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(139, 92, 246, 0.35),
                    transparent 35%
                ),
                #0f172a;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        .card {
            padding: 45px 35px;

            background: rgba(15, 23, 42, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.5);

            backdrop-filter: blur(15px);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background: linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );

            font-size: 35px;

            box-shadow:
                0 10px 35px rgba(99, 102, 241, 0.35);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .search {
            display: flex;
            gap: 10px;
        }

        #nameInput {
            flex: 1;

            min-width: 0;

            padding: 16px 18px;

            border: 1px solid #334155;
            border-radius: 12px;

            outline: none;

            background: #1e293b;
            color: white;

            font-size: 16px;

            transition: 0.2s;
        }

        #nameInput::placeholder {
            color: #64748b;
        }

        #nameInput:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        #searchButton {
            padding: 16px 23px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #3b82f6,
                #6366f1
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #searchButton:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(99, 102, 241, 0.4);
        }

        #searchButton:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 20px;
        }

        .result {
            padding: 18px;

            border-radius: 14px;

            font-size: 19px;
            font-weight: 600;

            animation: appear 0.25s ease;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);

            border: 1px solid rgba(239, 68, 68, 0.4);

            color: #fca5a5;
        }

        .success {
            background: rgba(34, 197, 94, 0.15);

            border: 1px solid rgba(34, 197, 94, 0.4);

            color: #86efac;
        }

        .info {
            background: rgba(59, 130, 246, 0.15);

            border: 1px solid rgba(59, 130, 246, 0.4);

            color: #93c5fd;
        }

        .warning {
            background: rgba(245, 158, 11, 0.15);

            border: 1px solid rgba(245, 158, 11, 0.4);

            color: #fcd34d;
        }

        .footer {
            margin-top: 20px;

            text-align: center;

            color: #64748b;

            font-size: 13px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {

            .card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 15px;
            }

            .search {
                flex-direction: column;
            }

            #searchButton {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="card">

            <div class="logo">
                🔍
            </div>

            <h1>База данных имен</h1>

            <p class="subtitle">
                Введите имя для проверки по базе
            </p>

            <div class="search">

                <input
                    type="text"
                    id="nameInput"
                    placeholder="Например: Дони"
                    autocomplete="off"
                >

                <button id="searchButton">
                    Проверить
                </button>

            </div>

            <div id="result"></div>

        </div>

        <div class="footer">
            База данных имен
        </div>

    </main>


    <script>

        // ==============================
        // БАЗА ИМЕН
        // ==============================

        const database = {

            "Дони": {
                type: "error",
                message: "Идиот"
            },

            "Самира": {
                type: "success",
                message: "Самилкааа жена Дони"
            },

            "Асаль": {
                type: "info",
                message: "Няшечко вкусняшка"
            },

            "Артем": {
                type: "warning",
                message: "качек"
            },

            "Артём": {
                type: "warning",
                message: "качек"
            }

        };


        // ==============================
        // ПОЛУЧАЕМ ЭЛЕМЕНТЫ СТРАНИЦЫ
        // ==============================

        const nameInput =
            document.getElementById("nameInput");

        const searchButton =
            document.getElementById("searchButton");

        const result =
            document.getElementById("result");


        // ==============================
        // ФУНКЦИЯ ПОИСКА
        // ==============================

        function searchName() {

            const name =
                nameInput.value.trim();

            // Очищаем старый результат
            result.innerHTML = "";


            // Если поле пустое
            if (!name) {

                showResult(
                    "warning",
                    "Введите имя для поиска."
                );

                return;
            }


            // Проверяем имя в базе
            if (database[name]) {

                const person =
                    database[name];

                showResult(
                    person.type,
                    person.message
                );

            } else {

                showResult(
                    "warning",
                    "Такого человека еще нет на базе."
                );

            }

        }


        // ==============================
        // ПОКАЗ РЕЗУЛЬТАТА
        // ==============================

        function showResult(type, message) {

            result.innerHTML = `
                <div class="result ${type}">
                    ${message}
                </div>
            `;

        }


        // ==============================
        // КНОПКА
        // ==============================

        searchButton.addEventListener(
            "click",
            searchName
        );


        // ==============================
        // ENTER
        // ==============================

        nameInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    searchName();
                }

            }
        );

    </script>

</body>
</html>
